<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Certificate - CERT-6927A78DB5DC7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Georgia', serif;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .certificate {
            width: 842px;
            height: 595px;
            background: white;
            border: 8px solid #1e40af;
            position: relative;
            padding: 40px 60px;
            box-shadow: 0 0 30px rgba(0,0,0,0.1);
        }
        .inner-border {
            border: 2px solid #3b82f6;
            height: 100%;
            padding: 30px;
            position: relative;
        }
        .circle-left {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #f59e0b;
            border-radius: 50%;
            top: 120px;
            left: 40px;
            opacity: 0.8;
        }
        .circle-right {
            position: absolute;
            width: 150px;
            height: 150px;
            background: #f59e0b;
            border-radius: 50%;
            bottom: 80px;
            right: 40px;
            opacity: 0.8;
        }
        .ellipse-top {
            position: absolute;
            width: 220px;
            height: 120px;
            background: #5b7fc7;
            border-radius: 50%;
            top: 50px;
            right: 80px;
            opacity: 0.8;
        }
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .title {
            font-size: 48px;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
        .subtitle {
            font-size: 18px;
            color: #374151;
            margin-bottom: 15px;
        }
        .name {
            font-size: 42px;
            color: #5b7fc7;
            font-weight: bold;
            margin: 15px 0 20px;
            font-style: italic;
        }
        .description {
            font-size: 15px;
            color: #374151;
            margin: 10px 0;
            line-height: 1.5;
        }
        .course-name {
            font-size: 26px;
            color: #1e3a8a;
            font-weight: bold;
            margin: 20px 0 10px;
        }
        .date {
            font-size: 13px;
            color: #6b7280;
            margin: 8px 0 25px;
        }
        .certificate-number {
            font-size: 11px;
            color: #9ca3af;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        .signature-section {
            margin-top: 25px;
        }
        .signature {
            font-size: 28px;
            color: #5b7fc7;
            font-style: italic;
            margin-bottom: 3px;
            font-weight: 600;
        }
        .signature-name {
            font-size: 15px;
            color: #1e3a8a;
            font-weight: bold;
            margin-bottom: 3px;
        }
        .signature-date {
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="certificate">
        <div class="circle-left"></div>
        <div class="circle-right"></div>
        <div class="ellipse-top"></div>
        <div class="inner-border">
            <div class="content">
                <div class="title">CERTIFICATE OF<br>COMPLETION</div>
                <div class="subtitle">This Certifies that</div>
                <div class="name">bejon singkong</div>
                <div class="description">
                    Has Successfully Completed the Webace Training<br>
                    Program, Entitled
                </div>
                <div class="course-name">data</div>
                <div class="date">on November 27, 2025</div>
                <div class="certificate-number">CERT-6927A78DB5DC7</div>
                <div class="signature-section">
                    <div class="signature">frans</div>
                    <div class="signature-name">Mr. frans</div>
                    <div class="signature-date">on November 27, 2025</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
